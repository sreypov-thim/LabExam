# POD 1: API Gateway + Registration (two containers in one pod)
# Containers in the same pod share localhost, so the gateway reaches
# the registration container at http://localhost:3001
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod1-gateway-registration
  labels:
    app: pod1-gateway-registration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod1-gateway-registration
  template:
    metadata:
      labels:
        app: pod1-gateway-registration
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:1.0
          imagePullPolicy: Never        
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: REGISTRATION_URL
              value: "http://localhost:3001"
            - name: UPDATE_URL
              value: "http://update-service:3002"

        - name: registration-service
          image: registration-service:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-secret  
                  key: MONGO_URI