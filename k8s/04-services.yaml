# Service for Pod 1 - the ONLY entry point from outside the cluster.
# Every client request goes through the API gateway on NodePort 30080.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
spec:
  type: NodePort
  selector:
    app: pod1-gateway-registration
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30090
---
# Service for Pod 2 - internal only (ClusterIP). The gateway calls it by name:
# http://update-service:3002
apiVersion: v1
kind: Service
metadata:
  name: update-service
spec:
  type: ClusterIP
  selector:
    app: pod2-update
  ports:
    - name: http
      port: 3002
      targetPort: 3002
