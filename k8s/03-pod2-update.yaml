# POD 2: Update (mobile number / password) microservice
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod2-update
  labels:
    app: pod2-update
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod2-update
  template:
    metadata:
      labels:
        app: pod2-update
    spec:
      containers:
        - name: update-service
          image: update-service:1.0
          imagePullPolicy: Never       
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-secret   
                  key: MONGO_URI